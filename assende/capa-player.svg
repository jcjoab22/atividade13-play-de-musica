<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgYT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="40%" stop-color="#14061a"/>
      <stop offset="70%" stop-color="#2a082b"/>
      <stop offset="100%" stop-color="#0d0214"/>
    </linearGradient>
    <linearGradient id="gridSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="60%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff5500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgYT)"/>

  <!-- Sunset Glow & Neon Sun -->
  <circle cx="320" cy="180" r="140" fill="url(#sunGlow)"/>
  <circle cx="320" cy="170" r="75" fill="url(#gridSky)"/>

  <!-- Horizontal Sun Slices (Synthwave/Cyber Style) -->
  <rect x="235" y="155" width="170" height="4" fill="#14061a"/>
  <rect x="238" y="167" width="164" height="6" fill="#14061a"/>
  <rect x="245" y="181" width="150" height="8" fill="#14061a"/>
  <rect x="255" y="197" width="130" height="10" fill="#14061a"/>
  <rect x="270" y="215" width="100" height="12" fill="#14061a"/>

  <!-- Skyline City Silhouette -->
  <polygon points="120,245 150,190 180,245" fill="#0d0312"/>
  <rect x="180" y="210" width="30" height="35" fill="#0a020e"/>
  <rect x="220" y="180" width="40" height="65" fill="#0d0312"/>
  <polygon points="260,245 285,160 310,245" fill="#0a020e"/>
  <rect x="330" y="170" width="45" height="75" fill="#0d0312"/>
  <polygon points="390,245 420,195 450,245" fill="#0a020e"/>
  <rect x="460" y="205" width="35" height="40" fill="#0d0312"/>

  <!-- Perspective Horizon & Grid Road -->
  <polygon points="0,245 640,245 640,360 0,360" fill="#07010a"/>
  <line x1="0" y1="245" x2="640" y2="245" stroke="#00ffff" stroke-width="2"/>

  <!-- Road Grid Lines -->
  <line x1="320" y1="245" x2="320" y2="360" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
  <line x1="320" y1="245" x2="160" y2="360" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <line x1="320" y1="245" x2="480" y2="360" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <line x1="320" y1="245" x2="0" y2="360" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
  <line x1="320" y1="245" x2="640" y2="360" stroke="#00ffff" stroke-width="2" opacity="0.6"/>

  <!-- Horizontal Grid Lines -->
  <line x1="0" y1="260" x2="640" y2="260" stroke="#ff00aa" stroke-width="1.2" opacity="0.7"/>
  <line x1="0" y1="280" x2="640" y2="280" stroke="#ff00aa" stroke-width="1.6" opacity="0.8"/>
  <line x1="0" y1="310" x2="640" y2="310" stroke="#ff00aa" stroke-width="2" opacity="0.9"/>
  <line x1="0" y1="350" x2="640" y2="350" stroke="#ff00aa" stroke-width="2.5" opacity="1"/>
</svg>